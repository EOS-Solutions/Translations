name: Load BaseApp Translations

on:
  workflow_dispatch:
    inputs:
      bc_version:
        description: 'BC major version (e.g. 28)'
        required: true
      country:
        description: 'Country code (e.g. it)'
        required: false
        default: 'it'
      cultureList:
        description: 'Comma-separated culture codes (e.g. it-IT, de-DE)'
        required: false
        default: 'it-IT'

permissions:
  contents: write
  pull-requests: write

jobs:
  load-translations:
    runs-on: windows-latest
    env:
      TARGET_BRANCH: master-bc${{ github.event.inputs.bc_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Download BC artifacts via Eos.Nav.Al
        shell: pwsh
        run: |
          Import-Module "${{ github.workspace }}/.github/workflows/Eos.Nav.Al.dll"

          $version = "${{ github.event.inputs.bc_version }}"
          $country = "${{ github.event.inputs.country }}"

          Write-Host "Downloading OnPrem artifacts for BC $version ($country)..."
          $artifactFolder = [Eos.Nav.Al.Artifacts.ArtifactDownloader]::Download(
            [Eos.Nav.Al.Artifacts.ArtifactReader]::new(
              [Eos.Nav.Al.Artifacts.ArtifactType]::OnPrem
            ).GetLatest($version, $country).Result,
            $false,
            $false
          ).Result.Artifact.GetLocalFolder().Result.FullName

          Write-Host "Artifact folder: $artifactFolder"
          echo "ARTIFACT_FOLDER=$artifactFolder" >> $env:GITHUB_ENV

      - name: Extract BaseApp XLF files
        shell: pwsh
        env:
          CULTURE_LIST: ${{ github.event.inputs.cultureList }}
          SOURCE_COUNTRY: ${{ github.event.inputs.country }}
        run: |
          $artifactFolder = $env:ARTIFACT_FOLDER
          $tempExtracted = "./Temp/Extracted"
          $outputFolder = "./BaseApp"
          $sourceFolder = Join-Path $artifactFolder "Applications/BaseApp/Source"
          $sourceLocalization = $env:SOURCE_COUNTRY.Trim().ToLowerInvariant()

          if ($sourceLocalization -notmatch '^[a-z0-9-]+$') {
            throw "Invalid source country code '$($env:SOURCE_COUNTRY)'."
          }

          $cultures = @(
            $env:CULTURE_LIST -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ } |
              Select-Object -Unique
          )
          if ($cultures.Count -eq 0) {
            throw "Provide at least one culture code in cultureList."
          }

          $culturePackages = @(
            foreach ($culture in $cultures) {
              try {
                $cultureInfo = [System.Globalization.CultureInfo]::GetCultureInfo($culture)
              } catch {
                throw "Invalid culture code '$culture' in cultureList."
              }
              if ($cultureInfo.IsNeutralCulture) {
                throw "Culture '$culture' must include a region, for example 'fr-FR'."
              }

              $languageName = $cultureInfo.EnglishName -replace '\s+\(', ' language ('
              [PSCustomObject]@{
                Culture = $culture
                ZipName = '{0}.Source.zip' -f $languageName
              }
            }
          )

          # Extract Base Application source
          $baseAppZip = Join-Path $sourceFolder "Base Application.Source.zip"
          if (-not (Test-Path $baseAppZip)) {
            throw "BaseApp source zip not found at $baseAppZip"
          }
          New-Item -ItemType Directory -Path "$tempExtracted/BaseApp" -Force | Out-Null
          Expand-Archive -Path $baseAppZip -DestinationPath "$tempExtracted/BaseApp" -Force
          Write-Host "Extracted BaseApp"

          foreach ($culturePackage in $culturePackages) {
            $languageZip = Join-Path $sourceFolder $culturePackage.ZipName
            if (Test-Path $languageZip) {
              $cultureExtractFolder = Join-Path (Join-Path $tempExtracted "Languages") $culturePackage.Culture
              New-Item -ItemType Directory -Path $cultureExtractFolder -Force | Out-Null
              Expand-Archive -Path $languageZip -DestinationPath $cultureExtractFolder -Force
              Write-Host "Extracted $($culturePackage.ZipName)"
            } else {
              Write-Host "Language source zip '$($culturePackage.ZipName)' not found; checking Base Application source."
            }
          }

          # Find XLF files for requested cultures and generic files.
          $exportCultures = @($cultures + 'g')
          $escapedCultures = $exportCultures | ForEach-Object { [regex]::Escape($_) }
          $culturePattern = '\.(' + ($escapedCultures -join '|') + ')\.xlf$'
          $xlfFiles = @(
            Get-ChildItem -Path $tempExtracted -Filter "*.xlf" -Recurse |
              Where-Object { $_.Name -match $culturePattern }
          )

          Write-Host "Found $($xlfFiles.Count) XLF files"
          if ($xlfFiles.Count -eq 0) {
            throw "No XLF files found for requested cultures: $($cultures -join ', ')."
          }

          $missingCultures = @(
            foreach ($culturePackage in $culturePackages) {
              $cultureFilePattern = '\.' + [regex]::Escape($culturePackage.Culture) + '\.xlf$'
              if (-not ($xlfFiles | Where-Object { $_.Name -match $cultureFilePattern })) {
                "$($culturePackage.Culture) (expected $($culturePackage.ZipName))"
              }
            }
          )
          if ($missingCultures.Count -gt 0) {
            throw "Requested culture(s) not available in '$sourceLocalization' BaseApp: $($missingCultures -join ', ')."
          }

          $filesToCopy = @()
          $destinationFiles = @{}
          foreach ($file in $xlfFiles) {
            $normalizedBaseName = $file.BaseName -replace '\s+', ''
            $destinationName = "${sourceLocalization}_${normalizedBaseName}$($file.Extension)"
            if ($destinationFiles.ContainsKey($destinationName)) {
              $existingFile = $destinationFiles[$destinationName]
              $existingHash = (Get-FileHash -LiteralPath $existingFile.FullName -Algorithm SHA256).Hash
              $currentHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
              if ($existingHash -ne $currentHash) {
                throw "Conflicting XLF files map to '$destinationName': '$($existingFile.FullName)' and '$($file.FullName)'."
              }
              Write-Host "Skipping duplicate $($file.Name)"
              continue
            }

            $destinationFiles[$destinationName] = $file
            $filesToCopy += [PSCustomObject]@{
              Source = $file.FullName
              DestinationName = $destinationName
            }
          }

          # Clean existing XLF files from output folder, preserving other files (e.g. config.json)
          if (Test-Path $outputFolder) {
            Get-ChildItem -Path $outputFolder -Filter "*.xlf" |
              Where-Object {
                $_.Name -notmatch '^[a-z0-9]{2}_' -or
                  $_.Name.StartsWith("${sourceLocalization}_", [StringComparison]::OrdinalIgnoreCase)
              } |
              Remove-Item -Force
          } else {
            New-Item -ItemType Directory -Path $outputFolder -Force | Out-Null
          }

          foreach ($file in $filesToCopy) {
            $destinationPath = Join-Path $outputFolder $file.DestinationName
            Copy-Item -LiteralPath $file.Source -Destination $destinationPath
            Write-Host "Copied $($file.DestinationName)"
          }

          # Clean up temp files
          Remove-Item "./Temp" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "All XLF files placed in '$outputFolder'"

      - name: Commit changes and create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            BaseApp
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          commit-message: Update Base App translations (BC ${{ github.event.inputs.bc_version }}, ${{ github.event.inputs.country }})
          branch: automation/baseapp-translations/${{ env.TARGET_BRANCH }}-${{ github.event.inputs.country }}
          base: ${{ env.TARGET_BRANCH }}
          delete-branch: true
          title: Update Base App translations (BC ${{ github.event.inputs.bc_version }}, ${{ github.event.inputs.country }})
          body: |
            Automated update of BaseApp translation files.

            - BC version: `${{ github.event.inputs.bc_version }}`
            - Country: `${{ github.event.inputs.country }}`
            - Base branch: `${{ env.TARGET_BRANCH }}`

      - name: Log pull request URL
        if: steps.create-pr.outputs.pull-request-url != ''
        shell: pwsh
        run: |
          Write-Host "Pull request created or updated: ${{ steps.create-pr.outputs.pull-request-url }}"
